name: ID PASS - SmartScaner Build

on:
  push:
    branches:
      - main
      - develop
    tags:
      - '*'
  pull_request:
    branches:
      - '*'
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache local gradle repository
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
      - name: Build core-lib AAR (release) and demo APK (debug)
        run: |
          [ ! -z "$FIREBASE_SECRET" ] && gpg -o app/google-services.json --batch --passphrase="$FIREBASE_SECRET" -d app/google-services.json.gpg || echo "FIREBASE_SECRET not defined"
          ./gradlew :core-lib:assembleRelease :app:assembleDebug
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
      - name: Upload core-lib AAR
        uses: actions/upload-artifact@v4
        with:
          name: core-lib-aar
          path: core-lib/build/outputs/aar/
          retention-days: 1
      - name: Upload demo APK (debug)
        uses: actions/upload-artifact@v4
        with:
          name: demo-app-debug
          path: app/build/outputs/apk/debug/
          retention-days: 1
